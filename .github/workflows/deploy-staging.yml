name: TEST - deploiement

# Push sur `develop` => mise a jour automatique du TEST :
#   https://dev.worldwise-admission.com
#   https://app.dev.worldwise-admission.com
#
# "Run workflow" (onglet Actions) permet aussi d'envoyer sur le TEST n'importe
# quelle branche, par exemple hotfix/xxx avant de la publier en production.
#
# Aucune approbation : c'est l'environnement ou on casse des choses.
# Chaque deploiement apparait dans Deployments > staging.
#
# Secrets du depot (Settings > Secrets and variables > Actions) :
#   VPS_HOST              IP du VPS OVH
#   VPS_USER              utilisateur SSH de deploiement (deploy)
#   VPS_SSH_KEY           cle privee dediee a GitHub Actions (commande forcee sur le VPS)
#   VPS_SSH_KNOWN_HOSTS   sortie de `ssh-keyscan -p <port> -H <ip>`
#   VPS_PORT              (optionnel) port SSH, defaut 22

run-name: "TEST ← ${{ github.ref_name }}"

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch: {}

permissions:
  contents: read

# Un seul deploiement de test a la fois, jamais interrompu en cours de route
# (le flock de deploy.sh est la seconde barriere).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployer sur le TEST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: https://dev.worldwise-admission.com
    steps:
      - name: Preparer la connexion SSH
        # Les secrets passent par `env:`, jamais par interpolation directe dans
        # le script (cf. docs/INFRA-CHANGES.md §5.2).
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"     || { echo "::error::secret VPS_SSH_KEY absent"; exit 1; }
          test -n "$VPS_HOST"    || { echo "::error::secret VPS_HOST absent"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::secret VPS_SSH_KNOWN_HOSTS absent (ssh-keyscan -p <port> -H <ip>)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deployer ${{ github.ref_name }}
        # La cle est limitee cote VPS a une commande forcee (deploy/ssh-gate.sh) :
        # on n'envoie que "staging <sha>", jamais une commande shell.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "staging $GITHUB_SHA"

      - name: Verifier que le TEST sert bien ce commit
        env:
          SITE: https://dev.worldwise-admission.com
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$SITE/health")"
          echo "reponse /health : $body"
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::/health ne renvoie pas status=ok"; exit 1; }
          echo "$body" | grep -q '"env":"staging"' \
            || { echo "::error::le site de test n'annonce pas env=staging"; exit 1; }
          release="$(printf '%s' "$body" | sed -nE 's/.*"release":"([0-9a-f]+)".*/\1/p')"
          test -n "$release" || { echo "::error::/health ne renvoie aucune release"; exit 1; }
          case "$GITHUB_SHA" in
            "$release"*) echo "OK  release $release correspond a $GITHUB_SHA" ;;
            *) echo "::error::en ligne = $release mais commit demande = $GITHUB_SHA"; exit 1 ;;
          esac

      - name: Verifier que le TEST n'est pas indexable
        env:
          SITE: https://dev.worldwise-admission.com
          APP: https://app.dev.worldwise-admission.com
        run: |
          set -euo pipefail
          for u in "$SITE" "$APP"; do
            robots="$(curl -fsS --max-time 15 "$u/robots.txt")"
            echo "$u/robots.txt -> $(echo "$robots" | tr '\n' ' ')"
            echo "$robots" | grep -q 'Disallow: /' \
              || { echo "::error::$u/robots.txt n'interdit pas l'indexation"; exit 1; }
          done

      - name: Nettoyer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
