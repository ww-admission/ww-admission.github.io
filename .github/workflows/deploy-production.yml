name: Deploy - PRODUCTION (main)

# Merge de develop dans `main` => mise a jour du site LIVE :
#   https://worldwise-admission.com
#   https://app.worldwise-admission.com
#
# Le merge (Pull Request develop -> main, ou npm run promote) est l'acte
# humain qui declenche la production. Si "Required reviewers" est coche dans
#   Settings > Environments > production
# GitHub attend en plus un clic "Approve and deploy" avant le job deploy.
#
# Secrets attendus : identiques a deploy-staging.yml.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch: {}

permissions:
  contents: read

# Jamais deux deploiements de production en parallele, et on n'interrompt
# jamais celui qui tourne : l'arreter en pleine migration casserait le site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Controle avant production
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.info.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verifier que main ne contient rien qui ne soit pas passe par develop
        # Deux formes acceptees, les seules que produit un merge develop -> main :
        #  - fast-forward : le commit est dans develop ;
        #  - merge commit (bouton "Create a merge commit") : son contenu est
        #    identique a celui du cote develop, donc rien n'a ete ajoute en route.
        # Refuse : squash, rebase, commit pousse directement sur main.
        run: |
          set -euo pipefail
          # "Run workflow" manuel sur develop enverrait develop en production sans merge.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::la production ne se deploie que depuis main (ref recue : $GITHUB_REF)"
            exit 1
          fi
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          if git merge-base --is-ancestor HEAD origin/develop; then
            echo "OK  le commit deploye est dans develop (fast-forward)"
          elif git rev-parse --verify --quiet 'HEAD^2' >/dev/null \
            && git merge-base --is-ancestor 'HEAD^2' origin/develop \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo "OK  merge de develop ($(git rev-parse --short 'HEAD^2')) sans aucune modification supplementaire"
          else
            echo "::error::le commit $GITHUB_SHA contient du code absent de develop."
            echo "::error::Du code arriverait en production sans etre passe par le test."
            echo "::error::Merge develop -> main avec 'Create a merge commit' (pas Squash ni Rebase), ou npm run promote."
            exit 1
          fi

      - name: Resumer ce qui part en production
        id: info
        run: |
          set -euo pipefail
          release="$(git rev-parse --short HEAD)"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploiement production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$release\` |"
            echo "| Branche | \`main\` |"
            echo "| Vitrine | https://worldwise-admission.com |"
            echo "| Back-office | https://app.worldwise-admission.com |"
            echo ""
            echo "### Derniers commits"
            echo ""
            git --no-pager log --oneline -10 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deployer en production
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Approbation supplementaire seulement si "Required reviewers" est coche
    # sur cet environnement GitHub.
    environment:
      name: production
      url: https://worldwise-admission.com
    steps:
      - name: Preparer la cle SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"  || { echo "::error::secret VPS_SSH_KEY absent"; exit 1; }
          test -n "$VPS_HOST" || { echo "::error::secret VPS_HOST absent"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_SSH_KNOWN_HOSTS absent - premiere connexion en confiance aveugle (TOFU)"
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deployer
        # On deploie exactement le commit controle par `guard`, et non la pointe
        # de main au moment ou le VPS la lit (un merge suivant a pu arriver entre-temps).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -p "${VPS_PORT:-22}" \
              "$VPS_USER@$VPS_HOST" \
              "sudo /usr/local/sbin/wwa-deploy production --yes $GITHUB_SHA"

      - name: Verifier que la production sert bien le commit pousse
        env:
          SITE: https://worldwise-admission.com
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$SITE/health")"
          echo "reponse /health : $body"
          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::/health ne renvoie pas status=ok"; exit 1; }
          echo "$body" | grep -q '"env":"production"' \
            || { echo "::error::la production n'annonce pas env=production"; exit 1; }
          release="$(printf '%s' "$body" | sed -nE 's/.*"release":"([0-9a-f]+)".*/\1/p')"
          test -n "$release" || { echo "::error::/health ne renvoie aucune release"; exit 1; }
          case "$GITHUB_SHA" in
            "$release"*) echo "OK  release $release correspond a $GITHUB_SHA" ;;
            *) echo "::error::en ligne = $release mais commit pousse = $GITHUB_SHA"; exit 1 ;;
          esac

      - name: Verifier le SEO de la production
        env:
          SITE: https://worldwise-admission.com
          APP: https://app.worldwise-admission.com
        run: |
          set -euo pipefail
          # La vitrine DOIT etre indexable (un Disallow ici tuerait le referencement)
          robots="$(curl -fsS --max-time 15 "$SITE/robots.txt")"
          echo "$SITE/robots.txt -> $(echo "$robots" | tr '\n' ' ')"
          echo "$robots" | grep -q '^Allow: /' \
            || { echo "::error::la vitrine de production n'est pas indexable"; exit 1; }
          # Le back-office ne doit JAMAIS l'etre
          curl -fsSI --max-time 15 "$APP/login" | grep -qi 'x-robots-tag: *noindex' \
            || { echo "::error::$APP/login n'a pas l'en-tete noindex"; exit 1; }
          echo "OK  vitrine indexable, back-office noindex"

      - name: Nettoyer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Rappel en cas de probleme
        if: failure()
        run: |
          echo "## Le deploiement a echoue" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Retour arriere depuis le VPS :" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'sudo /usr/local/sbin/wwa-deploy production "$(cat /var/www/wwa/.deploy-previous)"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
