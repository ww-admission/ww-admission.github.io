; ============================================================================
; wwa-dev.conf - Reverb + queue worker de STAGING
;
; Installation :
;   sudo cp deploy/supervisor/wwa-dev.conf /etc/supervisor/conf.d/wwa-dev.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Le pendant production est deploy/supervisor/wwa.conf (port 8080, groupe wwa).
; ============================================================================

[group:wwa-dev]
programs=wwa-dev-reverb,wwa-dev-queue

; ── Reverb WebSocket (staging) ────────────────────────────────────────────
; Ecoute en loopback UNIQUEMENT : nginx proxifie /app (wss) vers ce port.
; Ne PAS mettre 0.0.0.0 -> le port 8081 serait joignable en clair depuis Internet.
[program:wwa-dev-reverb]
command=php /var/www/wwa-dev/api/artisan reverb:start --host="127.0.0.1" --port=8081 --no-interaction
directory=/var/www/wwa-dev/api
user=www-data
autostart=true
autorestart=true
startretries=5
numprocs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/wwa-dev-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; ── Queue worker (staging) ────────────────────────────────────────────────
; Traite les jobs async : validation MIME des pieces jointes, emails, etc.
[program:wwa-dev-queue]
command=php /var/www/wwa-dev/api/artisan queue:work --sleep=3 --tries=3 --timeout=30 --max-time=3600 --no-interaction
directory=/var/www/wwa-dev/api
user=www-data
autostart=true
autorestart=true
startretries=5
numprocs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/wwa-dev-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
