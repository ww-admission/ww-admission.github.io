; ============================================================================
; wwa.conf - Reverb + queue worker de PRODUCTION
;
; Installation :
;   sudo cp deploy/supervisor/wwa.conf /etc/supervisor/conf.d/wwa.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Le pendant staging est deploy/supervisor/wwa-dev.conf (port 8081, groupe wwa-dev).
; ============================================================================

[group:wwa]
programs=wwa-reverb,wwa-queue

; ── Reverb WebSocket (production) ────────────────────────────────────────────
; Ecoute en loopback UNIQUEMENT : nginx proxifie /app (wss) vers ce port.
; Ne PAS mettre 0.0.0.0 -> le port 8080 serait joignable en clair depuis Internet.
[program:wwa-reverb]
command=php /var/www/wwa/api/artisan reverb:start --host="127.0.0.1" --port=8080 --no-interaction
directory=/var/www/wwa/api
user=www-data
autostart=true
autorestart=true
startretries=5
numprocs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/wwa-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; ── Queue worker (production) ────────────────────────────────────────────────
; Traite les jobs async : validation MIME des pieces jointes, emails, etc.
[program:wwa-queue]
command=php /var/www/wwa/api/artisan queue:work --sleep=3 --tries=3 --timeout=30 --max-time=3600 --no-interaction
directory=/var/www/wwa/api
user=www-data
autostart=true
autorestart=true
startretries=5
numprocs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/wwa-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
