# ============================================================================
# Back-office - app.worldwise-admission.com
#
#   /            → redirige vers /login
#   /login       → connexion
#   /register    → inscription
#   /admin/*     → espace équipe WWA
#   /dashboard/* → espace candidat
#   /api/*       → routes BFF Astro (proxy vers Laravel)
#   tout le reste→ redirigé vers la vitrine
#
# Même process Node que la vitrine (127.0.0.1:4321). Les pages publiques
# (/, /contact, /faq…) sont PRÉRENDUES : le middleware Astro ne s'exécute pas
# pour elles au runtime, c'est donc nginx qui interdit ici leur duplication
# sur le sous-domaine.
#
# /etc/nginx/sites-available/wwa-app
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.worldwise-admission.com;

    # Pièces jointes candidature
    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-app.access.log;
    error_log  /var/log/nginx/wwa-app.error.log;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Le back-office ne doit jamais être indexé
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Assets buildés : servis depuis le disque ─────────────────────────────
    location ^~ /_astro/ {
        alias /var/www/wwa/dist/client/_astro/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ── Pages du back-office ────────────────────────────────────────────────
    location ^~ /login     { include snippets/wwa-node-proxy.conf; }
    location ^~ /register  { include snippets/wwa-node-proxy.conf; }
    location ^~ /admin     { include snippets/wwa-node-proxy.conf; }
    location ^~ /dashboard { include snippets/wwa-node-proxy.conf; }

    # ── BFF + service d'images Astro ────────────────────────────────────────
    location ^~ /api    { include snippets/wwa-node-proxy.conf; }
    location ^~ /_image { include snippets/wwa-node-proxy.conf; }
    location = /health     { include snippets/wwa-node-proxy.conf; access_log off; }

    # ── Racine : on envoie vers la connexion (login.astro redirige déjà les
    #    sessions valides vers /admin ou /dashboard) ───────────────────────
    location = / {
        return 302 /login;
    }

    # ── Fichiers statiques (logo, favicon, polices…) → servis par Node ──────
    location ~* \.[a-z0-9]+$ {
        include snippets/wwa-node-proxy.conf;
    }

    # ── Tout le reste appartient à la vitrine ──────────────────────────────
    location / {
        return 302 https://worldwise-admission.com$request_uri;
    }
}
