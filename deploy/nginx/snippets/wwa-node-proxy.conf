# ============================================================================
# Proxy vers le serveur Astro (Node standalone) — 127.0.0.1:4321
#
# /etc/nginx/snippets/wwa-node-proxy.conf
# Utilisé par wwa-site.conf et wwa-app.conf via `include snippets/...`.
# ============================================================================

proxy_pass         http://127.0.0.1:4321;
proxy_http_version 1.1;

# Host est transmis tel quel : src/middleware.ts s'en sert pour distinguer
# la vitrine du back-office.
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;

proxy_read_timeout    120s;
proxy_send_timeout    120s;
proxy_buffering       off;
proxy_redirect        off;
