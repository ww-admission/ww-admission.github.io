# ============================================================================
# Proxy vers le serveur Astro de STAGING (Node standalone) — 127.0.0.1:4322
#
# /etc/nginx/snippets/wwa-dev-node-proxy.conf
# Jumeau de wwa-node-proxy.conf, seul le port change. Deux fichiers explicites
# plutot qu'un proxy_pass avec variable : moins malin, zero surprise.
# ============================================================================

proxy_pass         http://127.0.0.1:4322;
proxy_http_version 1.1;

# Host transmis tel quel : src/middleware.ts s'en sert pour distinguer
# la vitrine de test du back-office de test.
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;

proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering    off;
proxy_redirect     off;
