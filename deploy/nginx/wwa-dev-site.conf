# ============================================================================
# Vitrine de TEST - dev.worldwise-admission.com
#
# /etc/nginx/sites-available/wwa-dev-site
#
# Tout l'environnement de test vit sous `dev.` : c'est ce qui permet a
# COOKIE_DOMAIN=.dev.domaine.com de couvrir dev.domaine.com ET
# app.dev.domaine.com sans jamais toucher aux sessions de production.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dev.worldwise-admission.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-dev-site.access.log;
    error_log  /var/log/nginx/wwa-dev-site.error.log;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # RIEN de l'environnement de test ne doit etre indexe. Le middleware Astro
    # pose deja cet en-tete, mais les pages prerendues (/, /contact, /faq...)
    # ne passent pas par le middleware au runtime : nginx est le filet.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /_astro/ {
        alias /var/www/wwa-dev/dist/client/_astro/;
        access_log off;
        expires 1y;
        # add_header dans un location remplace celui du server -> a repeter.
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow" always;
        try_files $uri =404;
    }

    location / {
        include snippets/wwa-dev-node-proxy.conf;
    }
}
