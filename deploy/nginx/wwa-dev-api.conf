# ============================================================================
# API Laravel + Reverb de TEST - api.dev.worldwise-admission.com
#
#   /api/*     -> Laravel (php-fpm), appele serveur-a-serveur par le BFF Astro
#   /app/*     -> Reverb WebSocket de STAGING (127.0.0.1:8081)
#   /storage/* -> interdit
#
# /etc/nginx/sites-available/wwa-dev-api
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.dev.worldwise-admission.com;

    root  /var/www/wwa-dev/api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-dev-api.access.log;
    error_log  /var/log/nginx/wwa-dev-api.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Reverb de staging : port 8081 (la prod est sur 8080) ─────────────────
    location /app {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /apps {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Pieces jointes : jamais servies en direct (le BFF Astro verifie la session)
    location ^~ /storage/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass         unix:/run/php/php8.3-fpm.sock;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        DOCUMENT_ROOT   $realpath_root;
        include              fastcgi_params;
        fastcgi_hide_header  X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
