# ============================================================================
# Vitrine publique - worldwise-admission.com
#
# /etc/nginx/sites-available/wwa-site
# Remplacer worldwise-admission.com par le domaine réel avant de copier.
# certbot ajoutera les blocs listen 443 ssl + la redirection HTTP→HTTPS.
#
# Les chemins du back-office (/login, /register, /admin, /dashboard) sont
# rendus côté serveur : c'est src/middleware.ts qui les redirige vers
# app.worldwise-admission.com.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name worldwise-admission.com www.worldwise-admission.com;

    # Pièces jointes candidature (page /candidature)
    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-site.access.log;
    error_log  /var/log/nginx/wwa-site.error.log;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets buildés : immutables (hash dans le nom de fichier)
    location ^~ /_astro/ {
        alias /var/www/wwa/dist/client/_astro/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include snippets/wwa-node-proxy.conf;
    }
}
