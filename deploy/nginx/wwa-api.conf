# ============================================================================
# API Laravel + Reverb - api.worldwise-admission.com
#
#   /api/*  → Laravel (php-fpm) - appelé serveur-à-serveur par le BFF Astro
#   /app/*  → Reverb (WebSocket) - appelé directement par le navigateur
#   /storage/* → volontairement NON exposé : les pièces jointes passent par
#                le BFF Astro (/api/attachments/{id}/download) qui vérifie
#                la session avant de streamer le fichier.
#
# /etc/nginx/sites-available/wwa-api
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.worldwise-admission.com;

    root  /var/www/wwa/api/public;
    index index.php;

    charset utf-8;

    # Uploads : doit être >= à la limite Laravel et à celle du bloc app
    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-api.access.log;
    error_log  /var/log/nginx/wwa-api.error.log;

    # ── Reverb : WebSocket temps réel ────────────────────────────────────────
    # Reverb écoute sur 127.0.0.1:8080 (supervisor, cf. api/supervisord.conf)
    location /app {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Endpoint HTTP d'émission d'événements de Reverb (utilisé par Laravel)
    location /apps {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Pièces jointes : jamais servies en direct ───────────────────────────
    # Le téléchargement passe par le BFF Astro (/api/attachments/{id}/download)
    # qui vérifie la session avant de streamer le fichier.
    location ^~ /storage/ {
        deny all;
    }

    # ── Laravel ──────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass         unix:/run/php/php8.3-fpm.sock;
        fastcgi_index        index.php;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param        DOCUMENT_ROOT   $realpath_root;
        include              fastcgi_params;
        fastcgi_hide_header  X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Aucun autre .php ne doit être exécutable
    location ~ \.php$ {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
