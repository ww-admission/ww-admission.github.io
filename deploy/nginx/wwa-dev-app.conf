# ============================================================================
# Back-office de TEST - app.dev.worldwise-admission.com
#
#   /            -> redirige vers /login
#   /login       -> connexion
#   /register    -> inscription
#   /admin/*     -> espace equipe WWA
#   /dashboard/* -> espace candidat
#   /api/*       -> routes BFF Astro
#   tout le reste-> redirige vers la vitrine de test
#
# /etc/nginx/sites-available/wwa-dev-app
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.dev.worldwise-admission.com;

    client_max_body_size 25M;

    access_log /var/log/nginx/wwa-dev-app.access.log;
    error_log  /var/log/nginx/wwa-dev-app.error.log;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /_astro/ {
        alias /var/www/wwa-dev/dist/client/_astro/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag  "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ^~ /login     { include snippets/wwa-dev-node-proxy.conf; }
    location ^~ /register  { include snippets/wwa-dev-node-proxy.conf; }
    location ^~ /admin     { include snippets/wwa-dev-node-proxy.conf; }
    location ^~ /dashboard { include snippets/wwa-dev-node-proxy.conf; }
    location ^~ /api       { include snippets/wwa-dev-node-proxy.conf; }
    location ^~ /_image    { include snippets/wwa-dev-node-proxy.conf; }
    location = /health     { include snippets/wwa-dev-node-proxy.conf; access_log off; }

    location = / {
        return 302 /login;
    }

    location ~* \.[a-z0-9]+$ {
        include snippets/wwa-dev-node-proxy.conf;
    }

    location / {
        return 302 https://dev.worldwise-admission.com$request_uri;
    }
}
