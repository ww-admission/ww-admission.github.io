# ============================================================================
# Cible de déploiement : PRODUCTION
#
# Sourcé par deploy/deploy.sh. Aucun secret ici — ce fichier est versionné.
# Les secrets vivent dans $APP_DIR/.env et $APP_DIR/api/.env (chmod 600).
#
# Remplacer worldwise-admission.com par le domaine réel avant le premier déploiement.
# ============================================================================

ENV_NAME=production
GIT_BRANCH=main

APP_DIR=/var/www/wwa

# Ports en loopback uniquement (nginx est la seule façade publique)
NODE_PORT=4321
REVERB_PORT=8080

SYSTEMD_UNIT=wwa-web
SUPERVISOR_GROUP=wwa

# INVARIANT : APP_HOST doit être un sous-domaine de SITE_HOST, et
# COOKIE_DOMAIN (dans .env) doit valoir exactement SITE_HOST.
SITE_HOST=worldwise-admission.com
APP_HOST=app.worldwise-admission.com
API_HOST=api.worldwise-admission.com

DB_NAME=wwa_production
DB_USER=wwa_user
