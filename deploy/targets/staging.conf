# ============================================================================
# Cible de déploiement : STAGING (environnement de test)
#
# Sourcé par deploy/deploy.sh. C'est la cible PAR DÉFAUT.
#
# Tout l'environnement de test vit sous `dev.` — c'est indispensable, pas
# cosmétique : COOKIE_DOMAIN=.dev.domaine.com couvre dev.domaine.com ET
# app.dev.domaine.com, sans jamais être envoyé aux hôtes de production.
#
# ⚠ Ne JAMAIS utiliser dev.app.domaine.com : dev.domaine.com n'est pas un
#   suffixe de dev.app.domaine.com, donc aucun COOKIE_DOMAIN ne peut couvrir
#   les deux sans remonter à .domaine.com — ce qui ferait écraser la session
#   de production par celle de test (même nom de cookie wwa_session).
# ============================================================================

ENV_NAME=staging
GIT_BRANCH=develop

APP_DIR=/var/www/wwa-dev

NODE_PORT=4322
REVERB_PORT=8081

SYSTEMD_UNIT=wwa-dev-web
SUPERVISOR_GROUP=wwa-dev

SITE_HOST=dev.worldwise-admission.com
APP_HOST=app.dev.worldwise-admission.com
API_HOST=api.dev.worldwise-admission.com

DB_NAME=wwa_staging
DB_USER=wwa_dev_user
